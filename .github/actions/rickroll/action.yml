name: Rickroll
description: Affiche un message et un lien en cas d'échec du build
runs:
  using: composite
  steps:
    - name: Message
      shell: bash
      run: |
        echo "::group::Rickroll"
        echo "Build échoué. Cadeau: https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        echo "::endgroup::"
