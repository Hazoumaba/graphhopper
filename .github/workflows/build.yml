name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

      #Modification du workflow GitHub
      - name: Run PIT mutation tests
        run: mvn -B org.pitest:pitest-maven:1.20.3:mutationCoverage -DargLine=""

      - name: Fail on mutation regression
        shell: bash
        run: |
          BASELINE=$(cat ci/mutation-baseline.txt)
          CURRENT=$(jq -r '.summary.mutationScore' target/pit-reports/mutation-testing-elements-report.json)
          echo "Baseline: $BASELINE%"
          echo "Current: $CURRENT%"
          awk -v base="$BASELINE" -v cur="$CURRENT" 'BEGIN { exit (cur + 0.0001 < base) }'
          rickroll-on-fail:
  rickroll-on-fail:
    name: Rickroll on failure
    needs: build
    if: ${{ needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Never gonna give you up
        uses: ./.github/actions/action.yml


