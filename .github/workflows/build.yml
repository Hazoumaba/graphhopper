name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq libxml2-utils

      - name: Install full reactor (no tests)
        run: mvn -B -DskipTests install

      - name: Ensure mutation baseline
        run: |
          if [ ! -f ci/mutation-baseline.txt ]; then
            mkdir -p ci
            echo "0" > ci/mutation-baseline.txt
            echo "Baseline créé avec valeur initiale 0%"
          fi

      - name: Run PIT mutation tests (core)
        run: mvn -B -pl core org.pitest:pitest-maven:1.20.3:mutationCoverage -DargLine="" -DoutputFormats=HTML,XML

      - name: Fail on mutation regression
        shell: bash
        run: |
          BASELINE=$(cat ci/mutation-baseline.txt)
          REPORT=$(find core/target/pit-reports -name 'mutations.xml' | sort | tail -n 1)
          
          if [ -z "$REPORT" ]; then
            echo "Rapport XML PIT introuvable"
            echo "Contenu de core/target/pit-reports:"
            ls -R core/target/pit-reports || echo "Répertoire inexistant"
            exit 1
          fi
          
          # Extraction du score depuis le fichier XML
          CURRENT=$(xmllint --xpath 'string(//mutation/@mutationScore)' "$REPORT" 2>/dev/null || echo "0")
          
          echo "Rapport: $REPORT"
          echo "Baseline: ${BASELINE}%"
          echo "Score actuel: ${CURRENT}%"
          
          # Comparaison avec tolérance de 0.01% pour éviter les faux positifs
          awk -v base="$BASELINE" -v cur="$CURRENT" 'BEGIN { 
            if (cur + 0.0001 < base) {
              print "RÉGRESSION: Le score de mutation a baissé!"
              print "   Attendu: >= " base "%"
              print "   Obtenu: " cur "%"
              exit 1
            } else {
              print "Score de mutation acceptable"
              exit 0
            }
          }'

      - name: Run unit tests
        run: mvn -B test

  rickroll-on-fail:
    name: Rickroll on failure
    needs: build
    if: ${{ needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Never gonna give you up
        uses: ./.github/actions/action.yml
