name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq

      # Installe tout le réacteur
      - name: Install full reactor (no tests)
        run: mvn -B -DskipTests install

      - name: Ensure mutation baseline
        run: |
          if [ ! -f ci/mutation-baseline.txt ]; then
            mkdir -p ci
            echo "0" > ci/mutation-baseline.txt
          fi

      - name: Run PIT mutation tests (core)
        run: mvn -B -pl core org.pitest:pitest-maven:1.20.3:mutationCoverage -DargLine="" -DoutputFormats=HTML,XML,JSON

      - name: Fail on mutation regression
        shell: bash
        run: |
          BASELINE=$(cat ci/mutation-baseline.txt)
          REPORT=$(find core/target/pit-reports -name 'mutation-testing-elements-report.json' | sort | tail -n 1)
          if [ -z "$REPORT" ]; then
            echo "Rapport JSON introuvable -> échec."
            ls -R core/target/pit-reports || true
            exit 1
          fi
          CURRENT=$(jq -r '.summary.mutationScore' "$REPORT")
          echo "Report: $REPORT"
          echo "Baseline: $BASELINE%"
          echo "Current: $CURRENT%"
          awk -v base="$BASELINE" -v cur="$CURRENT" 'BEGIN { exit (cur + 0.0001 < base) }'

  rickroll-on-fail:
    name: Rickroll on failure
    needs: build
    if: ${{ needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Never gonna give you up
        uses: ./.github/actions/action.yml
