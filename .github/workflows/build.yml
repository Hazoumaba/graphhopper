name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq libxml2-utils

      - name: Install full reactor (no tests)
        run: mvn -B -DskipTests install

      - name: Ensure mutation baseline
        run: |
          if [ ! -f ci/mutation-baseline.txt ]; then
            mkdir -p ci
            echo "0" > ci/mutation-baseline.txt
            echo "Baseline créé avec valeur initiale 0%"
          fi

      - name: Run PIT mutation tests (core)
        run: mvn -B -pl core org.pitest:pitest-maven:1.20.3:mutationCoverage -DargLine="" -DoutputFormats=HTML,XML

      - name: Parse PIT and expose score
        id: pit
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=$(cat ci/mutation-baseline.txt 2>/dev/null || echo "0")
          REPORT=$(find core/target/pit-reports -name 'mutations.xml' | sort | tail -n 1 || true)

          if [ -z "${REPORT:-}" ]; then
            echo "Rapport XML PIT introuvable"
            exit 1
          fi

          # Tente lecture directe, sinon calcule (KILLED / TOTAL) * 100
          CURRENT=$(xmllint --xpath 'string(//mutations/@mutationScore)' "$REPORT" 2>/dev/null || true)
          if [ -z "$CURRENT" ]; then
            KILLED=$(xmllint --xpath 'count(//mutation[@detected="true"])' "$REPORT")
            TOTAL=$(xmllint --xpath 'count(//mutation)' "$REPORT")
            if [ "$TOTAL" = "0" ]; then CURRENT="0"; else CURRENT=$(awk -v k="$KILLED" -v t="$TOTAL" 'BEGIN{printf "%.2f",(k/t)*100}'); fi
          fi

          # Valide numérique
          if ! [[ "$CURRENT" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "Score de mutation invalide: '$CURRENT'"
            exit 1
          fi

          echo "Rapport: $REPORT"
          echo "Baseline: ${BASELINE}%"
          echo "Score actuel: ${CURRENT}%"

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"

      - name: Fail on mutation regression
        shell: bash
        run: |
          base='${{ steps.pit.outputs.baseline }}'
          cur='${{ steps.pit.outputs.current }}'
          awk -v base="$base" -v cur="$cur" 'BEGIN {
            if (cur + 0.0001 < base) {
              print "RÉGRESSION: Le score de mutation a baissé!"
              print "Attendu: >= " base "%"
              print "Obtenu: " cur "%"
              exit 1
            } else {
              print "Score de mutation acceptable"
              exit 0
            }
          }'
      - name: Auto-update mutation baseline on improvement
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.pit.outputs.baseline }}'
          cur='${{ steps.pit.outputs.current }}'
          improved=$(awk -v base="$base" -v cur="$cur" 'BEGIN{print (cur > base + 0.0001) ? "yes" : "no"}')
          if [ "$improved" != "yes" ]; then
            echo "Pas d'amélioration (baseline=${base}%)."
            exit 0
          fi

          echo "$cur" > ci/mutation-baseline.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/mutation-baseline.txt
          git commit -m "ci: bump mutation baseline to ${cur}% [skip ci]" || exit 0

          attempt=0
          max=3
          while [ $attempt -lt $max ]; do
            attempt=$((attempt+1))
            echo "Tentative push #$attempt"
            # Synchronise avec remote
            git fetch origin master
            # Rebase sur dernière version distante
            git rebase origin/master || {
              echo "Conflit: reset sur origin/master et ré-applique baseline"
              git reset --hard origin/master
              echo "$cur" > ci/mutation-baseline.txt
              git add ci/mutation-baseline.txt
              git commit -m "ci: bump mutation baseline to ${cur}% [skip ci]" || true
            }
            # Push
            if git push origin HEAD:master ; then
              echo "Baseline mis à jour à ${cur}%"
              exit 0
            fi
            echo "Push rejeté, nouvelle tentative..."
            sleep 2
          done

          echo "Échec après ${max} tentatives (concurrence trop élevée)"
          exit 1

      - name: Run unit tests
        run: mvn -B test

  Solution:
    name: Solution
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Never gonna give you up
        uses: ./.github/actions/solution
